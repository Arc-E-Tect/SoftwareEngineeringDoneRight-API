type: object
title: VerificationEmailSentEventV1
description: Audit event published when a verification email has been sent successfully.
required:
  - username
  - emailAddress
  - occurredAt
properties:
  username:
    $ref: '../../../../../openapi/components/common/schemas/UsernameV1.yaml'
  emailAddress:
    type: string
    format: email
    description: The email address to which the verification email was sent.
  occurredAt:
    type: string
    format: date-time
    description: The ISO-8601 timestamp at which the verification email was sent.
