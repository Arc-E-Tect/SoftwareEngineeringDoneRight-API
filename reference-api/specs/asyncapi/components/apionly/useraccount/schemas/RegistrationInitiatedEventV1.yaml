type: object
title: RegistrationInitiatedEventV1
description: Audit event published when a user registration is initiated.
required:
  - username
  - emailAddress
  - occurredAt
properties:
  username:
    $ref: '../../../../../openapi/components/common/schemas/UsernameV1.yaml'
  emailAddress:
    type: string
    format: email
    description: The email address of the user whose registration was initiated.
  occurredAt:
    type: string
    format: date-time
    description: The ISO-8601 timestamp at which the registration was initiated.
