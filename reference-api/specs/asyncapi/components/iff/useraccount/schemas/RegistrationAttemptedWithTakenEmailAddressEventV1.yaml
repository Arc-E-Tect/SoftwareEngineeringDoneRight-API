type: object
title: RegistrationAttemptedWithTakenEmailAddressEventV1
description: Audit event published when a registration is attempted using an email address that is already registered.
required:
  - emailAddress
  - attemptedUsername
  - occurredAt
properties:
  emailAddress:
    type: string
    format: email
    description: The email address the attempted registration used.
  attemptedUsername:
    $ref: '../../../../../openapi/components/common/schemas/UsernameV1.yaml'
  occurredAt:
    type: string
    format: date-time
    description: The ISO-8601 timestamp at which the attempt occurred.
