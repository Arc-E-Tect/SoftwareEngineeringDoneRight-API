type: object
title: RegistrationAttemptedWithReservedUsernameEventV1
description: Audit event published when a registration is attempted using a reserved username.
required:
  - username
  - emailAddress
  - occurredAt
properties:
  username:
    $ref: '../../../../../openapi/components/common/schemas/UsernameV1.yaml'
  emailAddress:
    type: string
    format: email
    description: The email address associated with the account.
  occurredAt:
    type: string
    format: date-time
    description: The ISO-8601 timestamp at which the event occurred.
