title: Problem Details
description: >
  A machine-readable problem detail, per RFC 9457. Operation-specific error
  responses compose this schema via `allOf` and fix `type`/`title`/`status`
  to known values; use this schema directly only where no more specific
  problem type has been documented.
type: object
properties:
  type:
    title: Type
    description: >
      A URI reference that identifies the problem type. Defaults to
      "about:blank" when no more specific type applies.
    type: string
    format: uri
    default: about:blank
    examples:
      - about:blank
  title:
    title: Title
    description: A short, human-readable summary of the problem type.
    type: string
    examples:
      - Internal Server Error
  status:
    title: Status
    description: The HTTP status code generated by the origin server for this occurrence of the problem.
    type: integer
    examples:
      - 500
  detail:
    title: Detail
    description: A human-readable explanation specific to this occurrence of the problem.
    type: string
    examples:
      - An unexpected error occurred while processing the request.
  instance:
    title: Instance
    description: A URI reference that identifies the specific occurrence of the problem.
    type: string
    format: uri
    examples:
      - https://api.apionly.arc-e-tect.com/v1/users/registrations
additionalProperties: true
