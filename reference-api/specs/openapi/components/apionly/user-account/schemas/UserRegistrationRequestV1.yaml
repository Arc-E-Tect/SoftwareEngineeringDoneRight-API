title: User Registration Request
type: object
required:
  - username
  - emailAddress
properties:
  username:
    $ref: '../../../common/schemas/UsernameV1.yaml'
  emailAddress:
    type: string
    format: email
    description: The email address of the prospective user.
    minLength: 6
    maxLength: 254
    examples:
      - alice@wonderland.com

