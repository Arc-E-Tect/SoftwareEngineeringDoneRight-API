operations:
  publishRegistrationInitiated:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: >-
      Publish a RegistrationInitiated event when a user registration is
      initiated.
    messages:
      - $ref: '#/channels/auditV1/messages/registrationInitiatedMessage'
  publishVerificationEmailSent:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: >-
      Publish a VerificationEmailSent event when a verification email has been
      sent successfully.
