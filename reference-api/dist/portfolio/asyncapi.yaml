      - $ref: '#/channels/auditV1/messages/verificationEmailSentMessage'
  publishVerificationEmailResendRequested:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: >-
      Publish a VerificationEmailResendRequested event when a user requests a
      verification email to be resent.
    messages:
      - $ref: '#/channels/auditV1/messages/verificationEmailResendRequestedMessage'
  publishNewVerificationEmailSent:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: >-
      Publish a NewVerificationEmailSent event when a new verification email has
      been sent to a user.
    messages:
      - $ref: '#/channels/auditV1/messages/newVerificationEmailSentMessage'
  publishUserAccountCreated:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: Publish a UserAccountCreated event when a user account is created.
    messages:
      - $ref: '#/channels/auditV1/messages/userAccountCreatedMessage'
  publishConfirmationEmailSent:
    action: send
    channel:
      $ref: '#/channels/auditV1'
    summary: >-
      Publish a ConfirmationEmailSent event when a confirmation email has been
      sent.
    messages:
      - $ref: '#/channels/auditV1/messages/confirmationEmailSentMessage'
  publishPersonDeleted:
