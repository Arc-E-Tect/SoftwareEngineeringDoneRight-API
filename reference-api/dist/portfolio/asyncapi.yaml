asyncapi: 3.1.0
info:
  title: API-Only Async API (portfolio)
  version: 0.0.0
  description: Every event contract published across the API-Only landscape.
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: API-Only Kafka broker.
channels:
  auditV1:
    x-fragment-path: asyncapi/channels/apionly/useraccount/AuditV1.yaml
    address: apionly.useraccount.audit.v1
    description: Audit events for the user-account domain.
    messages:
      registrationInitiatedMessage:
        x-fragment-path: >-
          asyncapi/messages/apionly/useraccount/RegistrationInitiatedMessageV1.yaml
        name: RegistrationInitiatedV1
        title: Registration Initiated
        summary: Audit event published when a user registration is initiated.
        contentType: application/json
        payload:
          x-fragment-path: >-
            asyncapi/components/apionly/useraccount/schemas/RegistrationInitiatedEventV1.yaml
          type: object
          title: RegistrationInitiatedEventV1
          description: Audit event published when a user registration is initiated.
          required:
            - username
            - emailAddress
            - occurredAt
          properties:
            username:
              x-fragment-path: openapi/components/common/schemas/UsernameV1.yaml
              type: string
              description: >
                The unique username of the account.

                Must be 5-12 characters, start with a lowercase letter,

                and contain only lowercase alphanumerics, dashes, or
                underscores.
              minLength: 5
              maxLength: 12
              pattern: ^[a-z][a-z0-9_-]*$
              examples:
                - alice_1
                - user-name
            emailAddress:
              type: string
              format: email
              description: The email address of the user whose registration was initiated.
            occurredAt:
              type: string
              format: date-time
              description: The ISO-8601 timestamp at which the registration was initiated.
        examples:
          - name: RegistrationInitiatedExample
            summary: >-
              Alice initiates the registration process with username alice and
              email address alice@wonderland.com.
            payload:
              username: alice
              emailAddress: alice@wonderland.com
              occurredAt: '2026-01-15T10:30:00Z'
      verificationEmailSentMessage:
        x-fragment-path: >-
          asyncapi/messages/apionly/useraccount/VerificationEmailSentMessageV1.yaml
        name: VerificationEmailSentV1
        title: Verification Email Sent
