apis:
  # The whole-landscape view, generated by the Publisher rather than
  # hand-written; run `npm run apionly -- build --target portfolio` first,
  # since this root is dist/ output, not a source file.
  apionly@v1:
    root: dist/portfolio/openapi.yaml

rules:
  # localhost is an intentional local-development server entry (marked x-internal: true).
  # It is not an accidental example.com placeholder, so this rule is disabled.
  no-server-example.com: off

