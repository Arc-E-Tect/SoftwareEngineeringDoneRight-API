[versions]
api-only-transcriberj = "0.13.0"
api-only-transcriberj-restdocs = "0.4.0"
api-only-transcriberj-wiremock = "0.1.0"
spring-boot = "4.1.1"
wiremock = "3.13.2"

[libraries]
api-only-transcriberj-restdocs = { module = "com.arc-e-tect:api-only-transcriberj-restdocs", version.ref = "api-only-transcriberj-restdocs" }
api-only-transcriberj-wiremock = { module = "com.arc-e-tect:api-only-transcriberj-wiremock", version.ref = "api-only-transcriberj-wiremock" }
# Standalone: it shades its own Jetty and Jackson, which Spring Boot's platform would otherwise upgrade.
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
asciidoctor = { id = "org.asciidoctor.jvm.convert", version = "4.0.5" }
api-only-transcriberj = { id = "com.arc-e-tect.api-only-transcriberj", version.ref = "api-only-transcriberj" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
