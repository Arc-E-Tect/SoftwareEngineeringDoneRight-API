# tag::create-book[]
post:
  operationId: createBook
  summary: Add a book to the catalogue.
  description: >-
    The ISBN identifies a book: a second book with the same ISBN is refused
    with 409. With Prefer: respond-async, the book is added in the background
    instead, and the answer is 202 with where it will be.
  # Prefer: respond-async selects 202: the generated contract cases of 202 send
  # it, and those of 201 leave it out.
  x-transcriberj-selected-responses:
    '202': {in: header, name: Prefer, value: respond-async}
  parameters:
    - name: Prefer
      in: header
      description: >-
        respond-async (RFC 7240) to have the book added in the background, and
        a 202 rather than the 201 with the book.
      schema:
        type: string
        minLength: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BookRequestV1.yaml
        examples:
          DesignPatterns:
            summary: A book without a subtitle.
            value:
              isbn: '9780201633610'
              title: Design Patterns
              pages: 395
              format: hardcover
          Refactoring:
            summary: A book with every field, its subtitle included.
            value:
              isbn: '9780134757599'
              title: Refactoring
              subtitle: Improving the Design of Existing Code
              pages: 448
              format: hardcover
        # The examples the generated contract cases send: the smallest valid request,
        # and the one with every member.
        x-transcriberj-examples:
          required: DesignPatterns
          full: Refactoring
  responses:
    '201':
      description: The book was added.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BookV1.yaml
    '202':
      description: >-
        The book is being added in the background, as Prefer: respond-async
        asked; Location is where it will be.
      headers:
        Location:
          description: The book's URL, which answers 404 until the book is added.
          schema:
            type: string
            minLength: 1
        Preference-Applied:
          description: respond-async, the preference the service honoured.
          schema:
            type: string
            const: respond-async
    '400':
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemV1.yaml
    '409':
      description: A book with this ISBN is already in the catalogue.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemV1.yaml
    '415':
      description: The request body is not JSON.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemV1.yaml
# end::create-book[]
get:
  operationId: listBooks
  summary: List the catalogue, a page at a time.
  parameters:
    - name: page
      in: query
      description: The page to return, the first being 0.
      schema:
        type: integer
        minimum: 0
        maximum: 1000
        default: 0
    - name: size
      in: query
      description: The number of books on a page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    '200':
      description: One page of the catalogue, in ISBN order.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BookPageV1.yaml
    '400':
      description: The request does not match the contract.
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ProblemV1.yaml
