type: object
description: One page of the catalogue.
required:
  - items
  - page
  - size
  - totalItems
properties:
  items:
    type: array
    description: The books on this page.
    items:
      $ref: BookV1.yaml
  page:
    type: integer
    description: The page, the first being 0.
    minimum: 0
  size:
    type: integer
    description: The number of books a page holds.
    minimum: 1
  totalItems:
    type: integer
    description: The number of books in the catalogue.
    minimum: 0
