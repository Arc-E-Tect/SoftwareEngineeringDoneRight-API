# Reference pipeline: publish API description bundles from GitLab CI, with the
# sealed api-only-publisher image, in one job.
# README.adoc#docker-gitlab explains it; copy it to .gitlab-ci.yml.
#
# Everything the job runs is in one image, pinned by digest: the Publisher and its
# bundlers. Nothing is downloaded while it runs -- no npm, no npx -- so a pipeline
# that may run only vetted, mirrored artefacts needs to vet and mirror this one.
#
# The image is sealed: it refuses to contact anything unless a job sets
# API_ONLY_PUBLISHER_REMOTE: allow, as `publish` below does, and only `publish`.
#
# apionly.yaml needs no GitLab settings: in a GitLab CI job the gitlab-package
# channel takes the API URL, the project and CI_JOB_TOKEN from GitLab's CI
# variables, and publishes each target to this project's Generic Package Registry.
#
#   channels:
#     gitlab-package: {}
#     # release: true also creates the GitLab release, and with it the tag
#     # <target>-v<version> that check and publish read to tell a released version
#     # from a changed one; without it, nothing creates that tag.
#     # For Gradle and Maven consumers, this project's Maven registry as well
#     # (GitLab takes the job token in the Job-Token header):
#     # maven:
#     #   groupId: com.example.api
#     #   repository: https://gitlab.example.com/api/v4/projects/<project id>/packages/maven
#     #   tokenEnv: CI_JOB_TOKEN
#     #   tokenHeader: Job-Token
#
# A re-run is safe: a version the registry already has is left alone when it holds
# the same documents, and is never replaced -- also where the project allows
# duplicate packages, as GitLab does by default. A registry that holds other
# documents, or cannot be reached, is a warning in the job's log, never a failed
# job. A changed target without a new version is what fails, before anything is
# sent -- and in the merge request first, in `check`.

variables:
  # The image, pinned by digest: https://hub.docker.com/r/arcetect/api-only-publisher/tags
  # From your organisation's mirror instead, for example:
  #   PUBLISHER_IMAGE: registry.example.com/mirror/arcetect/api-only-publisher@sha256:<digest>
  PUBLISHER_IMAGE: docker.io/arcetect/api-only-publisher@sha256:<digest>
  # The targets to publish, as apionly.yaml names them.
  TARGETS: orders payments

stages:
  - check
  - publish

workflow:
  rules:
    # A v* tag, as the GitHub Actions reference pipeline: never the tag a GitLab
    # release with release: true puts on the commit, <target>-v<version>, which
    # would start this pipeline again for nothing.
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# A target changed without a new version fails the merge request, before anything
# is merged: compared with the merge-base with the target branch, and exactly with a
# target's release tag where it has one. Sealed, as every job but `publish`.
check:
  stage: check
  image: $PUBLISHER_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    # A merge request's pipeline fetches its own ref; the target branch is fetched for the merge-base.
    - git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - api-only-publisher check --since "$(git merge-base HEAD "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")"

publish:
  stage: publish
  image: $PUBLISHER_IMAGE
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    # The one job that may contact anything: the project's package registry.
    API_ONLY_PUBLISHER_REMOTE: allow
    # The history and release tags publish checks each target's version against.
    GIT_DEPTH: "0"
  script:
    # The default branch too, which a tag's pipeline does not fetch: publish compares
    # a target without a release tag with it (versioning.mainBranch names it).
    - git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - set -- $(for target in $TARGETS; do printf -- '--target %s ' "$target"; done)
    - api-only-publisher build "$@"
    - api-only-publisher lint
    - api-only-publisher publish "$@"
