plugins {
    // On the root as well as on each module: the shared security-scan workflow looks
    // for dependencyCheckUpdate on the root, and running it there runs every module's.
    alias(libs.plugins.owasp.dependency.check)
    alias(libs.plugins.plugin.publish) apply false
    alias(libs.plugins.jreleaser) apply false
}

// Conventions both modules share. Each module's own build file says what it is.
allprojects {
    apply plugin: 'org.owasp.dependencycheck'

    dependencyCheck {
        // Fatal findings fail the build only when the caller asks; otherwise the scan
        // reports and the build continues, so a new CVE in a transitive dependency
        // does not block an unrelated release at an arbitrary moment.
        failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
        // Every module reports under the root's build/reports, where the scan
        // workflow collects them from.
        outputDirectory = rootProject.layout.buildDirectory.dir("reports/dependency-check/${project.name}").get().asFile.path
        nvd {
            apiKey = System.getenv('NVD_APIKEY_SEDR')
        }
        analyzers {
            // A JVM build. The Node analyzers would only report on the release
            // bookkeeping's package-lock.json, which ships nowhere.
            nodeAuditEnabled = false
            nodeEnabled = false
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            // 21, as the Subscriber and every sibling plugin target: a Gradle plugin runs
            // inside the consumer's Gradle JVM, so this is a compatibility floor.
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // The reference contracts and the Publisher scaffold, shared by both modules.
        systemProperty 'transcriberj.fixtures', rootProject.file('fixtures').absolutePath
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    tasks.named('test') {
        finalizedBy 'jacocoTestReport'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    jacocoTestCoverageVerification {
        // No exclusions, as for the Publisher and the Subscriber.
        violationRules {
            rule {
                limit {
                    minimum = 0.9
                }
            }
        }
    }

    // Javadoc is part of the product: the model and the SPI are what every emitter is
    // written against. Warnings are errors, as in the Subscriber.
    tasks.named('javadoc') {
        options {
            encoding = 'UTF-8'
            addBooleanOption('Xdoclint:all', true)
            addBooleanOption('Xwerror', true)
        }
    }

    tasks.named('check') {
        dependsOn 'jacocoTestCoverageVerification', 'javadoc'
    }
}
