plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    alias(libs.plugins.owasp.dependency.check)
    // Publishes to the Gradle Plugin Portal, the only place the plugin is published.
    // The emitter interface is part of the plugin: an emitter library compiles against
    // this artifact, and one release publishes both.
    alias(libs.plugins.plugin.publish)
    // Kept for publishToMavenLocal, which is how the plugin is used before it is
    // released.
    id 'maven-publish'
}

description = 'Generates a contract-derived Java class tree from a subscribed API contract.'

repositories {
    mavenCentral()
    // The API-Only Subscriber is published to the Gradle Plugin Portal only.
    gradlePluginPortal()
}

java {
    toolchain {
        // 21, as the Subscriber and every sibling plugin target: a Gradle plugin runs
        // inside the consumer's Gradle JVM, so this is a compatibility floor.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

gradlePlugin {
    website = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API/tree/main/api-only-transcriberj'
    vcsUrl  = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'

    plugins {
        apiOnlyTranscriberJ {
            id                  = 'com.arc-e-tect.api-only-transcriberj'
            implementationClass = 'com.arc_e_tect.gradle.apionly.transcriberj.ApiOnlyTranscriberJPlugin'
            displayName         = 'Arc-E-Tect API-Only TranscriberJ'
            description         = project.description
            tags                = ['openapi', 'api-first', 'contract', 'code-generation', 'rest-docs']
            compatibility {
                features {
                    // Asserted because it is tested: ApiOnlyTranscriberJPluginFunctionalTest
                    // runs a real build twice with --configuration-cache and requires the
                    // second to reuse the entry.
                    configurationCache = true
                }
            }
        }
    }
}

// The published POM is what the Plugin Portal reads to describe this plugin.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Arc-E-Tect API-Only TranscriberJ'
            description = project.description
            url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API/tree/main/api-only-transcriberj'
            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'arc-e-tect'
                    name = 'Arc-E-Tect'
                }
            }
            scm {
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API'
                connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
                developerConnection = 'scm:git:git@github.com:Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
            }
        }
    }
}

// Ship the licence inside the artifact, not only as a claim in its metadata.
tasks.named('jar') {
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}

dependencies {
    // updateApiOnlyTranscriberJDSL, as the Subscriber and every sibling plugin have it.
    implementation libs.dsl.updater.core

    // YAML 1.2, no transitive dependencies: the plugin's runtime classpath is the
    // consumer's build script classpath, so every dependency here is theirs too.
    implementation libs.snakeyaml.engine
    implementation libs.api.only.subscriber

    testImplementation gradleTestKit()
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.jackson.databind
    testImplementation libs.gradle.idea.ext
    // The oracle every generated valid value is checked against: test scope only, so
    // the plugin's runtime classpath -- the consumer's build script -- never sees it.
    testImplementation libs.json.schema.validator
    testRuntimeOnly    libs.joni
    // Generated code carries the marker annotation, so the tests compile against it.
    testImplementation libs.sedr.library
    testRuntimeOnly    libs.junit.platform.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The Publisher scaffold and the corpora, read by path, and the contracts of the
    // repository's reference API, built by its Publisher: inputs, so that changing either
    // runs the tests again.
    systemProperty 'transcriberj.fixtures', layout.projectDirectory.dir('src/test/resources/fixtures').asFile.absolutePath
    inputs.dir(layout.projectDirectory.dir('src/test/resources/fixtures')).withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('fixtures')
    systemProperty 'transcriberj.referenceApi', layout.projectDirectory.dir('../reference-api/dist').asFile.absolutePath
    inputs.dir(layout.projectDirectory.dir('../reference-api/dist')).withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('referenceApi')
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('test') {
    finalizedBy jacocoTestReport
}

// Re-records the committed baselines the valid-value work is held to: the hash of every
// source generated before it (T12.11), and the valid values of the reference contracts
// (T12.10). Only for a deliberate change; review the diff.
// recordInvalidRequestsGolden does the same for the invalid-request cases of the user-account
// contract of the reference API (T13.14), the tests an implementation of it is run against.
['recordBaselineSources': 'sources', 'recordValidValuesGolden': 'golden',
 'recordInvalidRequestsGolden': 'invalid-requests'].each { name, what ->
    tasks.register(name, JavaExec) {
        description = "Re-records the committed ${['sources': 'hashes of the existing generated sources', 'golden': 'valid values of the reference contracts', 'invalid-requests': 'invalid-request cases of the user-account contract'][what]}."
        group = 'verification'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.arc_e_tect.gradle.apionly.transcriberj.core.Baselines'
        systemProperty 'transcriberj.fixtures', layout.projectDirectory.dir('src/test/resources/fixtures').asFile.absolutePath
        systemProperty 'transcriberj.referenceApi', layout.projectDirectory.dir('../reference-api/dist').asFile.absolutePath
        args what
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    // No exclusions, as for the Publisher and the Subscriber. TestKit runs the plugin
    // in another process, so its tasks are tested in-process as well.
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

// Javadoc is part of the product: the model and the emitter interface are what every
// emitter is written against. Warnings are errors, as in the Subscriber.
tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
        addBooleanOption('Xdoclint:all', true)
        addBooleanOption('Xwerror', true)
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification, tasks.named('javadoc')
}

dependencyCheck {
    // Fatal findings fail the build only when the caller asks; otherwise the scan
    // reports and the build continues, so a new CVE in a transitive dependency
    // does not block an unrelated release at an arbitrary moment.
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        // A JVM build. The Node analyzers would only report on the release
        // bookkeeping's package-lock.json, which ships nowhere.
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}
