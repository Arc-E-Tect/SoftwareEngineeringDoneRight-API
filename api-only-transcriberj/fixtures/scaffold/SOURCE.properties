# The contract the API-Only Publisher's `init` scaffold builds, at this commit.
# It is the one real Publisher output with reusable components other than schemas:
# a response and a security scheme. Rebuild with:
#   node <publisher>/src/cli.js init <dir> --yes && node <publisher>/src/cli.js -C <dir> build
