[plugins]

plugin-publish              = { id = "com.gradle.plugin-publish",     version.ref = "plugin-publish" }
owasp-dependency-check      = { id = "org.owasp.dependencycheck",     version.ref = "owasp-dependency-check" }

[versions]
dsl-updater-core = "1.0.0"

owasp-dependency-check = "13.0.0"
plugin-publish  = "2.1.1"

junit-jupiter   = "6.1.3"
junit-platform  = "6.1.3"
assertj         = "3.27.7"
jackson         = "2.22.2"
# Jackson 3, which the reference implementation's hand-written event classes use to
# render their payloads; only the handwritten source set compiles against it.
jackson3        = "3.1.1"
# The version the reference implementation's hand-written classes compile against.
spring-restdocs = "4.0.1"
snakeyaml-engine = "3.1.1"
api-only-subscriber = "0.4.0"
# The marker annotation every generated class carries, so a coverage rule does not
# measure code nobody wrote. The plugin manages it for the projects it generates into.
sedr-library = "1.0.0"
# Only the tests use it: the plugin reacts to idea-ext when a build applies it,
# and reaches its model reflectively, so it compiles against nothing of it.
gradle-idea-ext = "1.4.1"
# The independent oracle the valid-value tests check every generated value with:
# JSON Schema 2020-12, errors by keyword and instance location, format assertion
# switchable. Test scope only; it never reaches the plugin's runtime classpath.
json-schema-validator = "3.0.7"
# Evaluates `pattern` as ECMA-262 for the oracle, rather than as java.util.regex.
joni = "2.2.6"

[libraries]
dsl-updater-core = { module = "com.arc-e-tect:dsl-updater-core", version.ref = "dsl-updater-core" }

junit-jupiter                = { module = "org.junit.jupiter:junit-jupiter",                  version.ref = "junit-jupiter" }
junit-platform-launcher      = { module = "org.junit.platform:junit-platform-launcher",       version.ref = "junit-platform" }
assertj-core                 = { module = "org.assertj:assertj-core",                         version.ref = "assertj" }
jackson-databind             = { module = "com.fasterxml.jackson.core:jackson-databind",      version.ref = "jackson" }
jackson3-databind            = { module = "tools.jackson.core:jackson-databind",              version.ref = "jackson3" }
api-only-subscriber          = { module = "com.arc-e-tect:api-only-subscriber",               version.ref = "api-only-subscriber" }
sedr-library                 = { module = "com.arc-e-tect.sedr.utils:sedr-library",            version.ref = "sedr-library" }
snakeyaml-engine             = { module = "org.snakeyaml:snakeyaml-engine",                   version.ref = "snakeyaml-engine" }
spring-restdocs-core         = { module = "org.springframework.restdocs:spring-restdocs-core", version.ref = "spring-restdocs" }
json-schema-validator        = { module = "com.networknt:json-schema-validator",              version.ref = "json-schema-validator" }
joni                         = { module = "org.jruby.joni:joni",                              version.ref = "joni" }
gradle-idea-ext              = { module = "gradle.plugin.org.jetbrains.gradle.plugin.idea-ext:gradle-idea-ext", version.ref = "gradle-idea-ext" }
