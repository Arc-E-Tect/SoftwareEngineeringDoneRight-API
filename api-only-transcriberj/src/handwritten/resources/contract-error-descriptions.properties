problem.type=A URI reference that identifies the problem type. Defaults to "about:blank" when no more specific type applies.
problem.title=A short, human-readable summary of the problem type.
problem.status=The HTTP status code generated by the origin server for this occurrence of the problem.
problem.detail=A human-readable explanation specific to this occurrence of the problem.
problem.instance=A URI reference that identifies the specific occurrence of the problem.
invalid_request.errors=An array of the individual validation failures that caused this request to be rejected.
invalid_request.details.message=A human-readable message describing the specific validation failure, typically explaining what the person did wrong without disclosing too much detail.
invalid_request.details.context=Contextual information about the validation failure, such as the field it relates to.
