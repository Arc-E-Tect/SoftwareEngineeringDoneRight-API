# Response coverage (T19.5, T19.6): every status whose answer the contract does not describe,
# ranges and default, the invalid-request status with nothing to violate and with something to
# violate, and a success whose valid request reaches a construct no rule represents. Generated
# with every kind, and with success only: what invalid requests would have covered is then
# switched off, and what they could not cover keeps its reason.
openapi: 3.1.0
info:
  title: Contract-case corpus, coverage
  version: 1.0.0
paths:
  /statuses:
    get:
      operationId: getStatuses
      responses:
        '200':
          description: Found.
        '301': {description: Moved.}
        '400': {description: Invalid, though nothing is constrained.}
        '401': {description: Unauthenticated.}
        '403': {description: Forbidden.}
        '409': {description: Conflict.}
        '418': {description: A teapot.}
        '422': {description: Unprocessable.}
        '429': {description: Too many.}
        '503': {description: Unavailable.}
        '4XX': {description: Some client error.}
        default: {description: Anything else.}
  /checked:
    get:
      operationId: getChecked
      parameters:
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Found.
        '400':
          description: Invalid.
  /degraded:
    post:
      operationId: postDegraded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice:
                  oneOf:
                    - {type: object, properties: {a: {type: string}}, required: [a]}
                    - {type: object, properties: {b: {type: string}}, required: [b]}
      responses:
        '201':
          description: Created.
