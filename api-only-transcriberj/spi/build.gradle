plugins {
    id 'java-library'
    id 'maven-publish'
    alias(libs.plugins.jreleaser)
}

description = 'The contract model and the emitter interface of the Arc-E-Tect API-Only TranscriberJ.'

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // YAML 1.2, no transitive dependencies: the plugin's runtime classpath is the
    // consumer's build script classpath, so every dependency here is theirs too.
    implementation libs.snakeyaml.engine

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

// Published to Maven Central by the release, through a staging repository that
// jReleaser signs and deploys; to mavenLocal for development, with publishToMavenLocal.
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'Arc-E-Tect API-Only TranscriberJ SPI'
                description = project.description
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API/tree/main/api-only-transcriberj'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'arc-e-tect'
                        name = 'Arc-E-Tect'
                    }
                }
                scm {
                    url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API'
                    connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
                    developerConnection = 'scm:git:git@github.com:Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'StagingDeploy'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Ship the licence inside the artifact, not only as a claim in its metadata.
tasks.named('jar') {
    from(rootProject.layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}

jreleaser {
    gitRootSearch = true
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepositories = ['build/staging-deploy']
                }
            }
        }
    }
}
