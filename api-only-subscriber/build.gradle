plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'jacoco'
    alias(libs.plugins.owasp.dependency.check)
    // Publishes to the Gradle Plugin Portal. That is the only place this plugin
    // is published: a Gradle consumer already has the portal configured, so
    // nothing about consuming it needs explaining.
    alias(libs.plugins.plugin.publish)
    // Kept for publishToMavenLocal, which is how the plugin is iterated on
    // locally. No remote Maven repository is configured, deliberately.
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        // 21, as every sibling plugin targets. A Gradle plugin runs inside the
        // consumer's Gradle JVM, so the bytecode level is a compatibility floor
        // imposed on them: compiling for 25 would exclude every build not yet on
        // it, to no benefit this plugin can point at.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

gradlePlugin {
    website = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API/tree/main/api-only-subscriber'
    vcsUrl  = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'

    plugins {
        apiOnlySubscriber {
            // A sibling of com.arc-e-tect.api-only-suite, not a part of it. The
            // suite bundles three detectors that answer "does this implementation
            // match its contract?". This one answers "where does the contract
            // come from?", and a project can want either without the other.
            id                  = 'com.arc-e-tect.api-only-subscriber'
            implementationClass = 'com.arc_e_tect.gradle.apionly.subscriber.ApiOnlySubscriberPlugin'
            displayName         = 'Arc-E-Tect API-Only Subscriber'
            description         = 'Fetches published API description documents into a build, verifies them against a committed lockfile, and fails when a contract has drifted.'
            tags                = ['openapi', 'asyncapi', 'api-first', 'contract', 'specification']
            compatibility {
                features {
                    // Asserted because it is tested: ApiOnlySubscriberPluginFunctionalTest
                    // runs a real build twice with --configuration-cache and requires the
                    // second to reuse the entry. Declaring this without such a test is how
                    // a plugin comes to claim a compatibility it quietly lost.
                    configurationCache = true
                }
            }
        }
    }
}

// The published POM is what the Plugin Portal reads to describe this plugin.
// Without this it carries coordinates and nothing else: no name, no description,
// and no licence -- so the artifact would claim nothing about its own terms while
// the repository is plainly MIT.
publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Arc-E-Tect API-Only Subscriber'
            description = 'Fetches published API description documents into a build, verifies them against a committed lockfile, and fails when a contract has drifted.'
            url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API/tree/main/api-only-subscriber'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                    distribution = 'repo'
                }
            }

            developers {
                developer {
                    id = 'arc-e-tect'
                    name = 'Arc-E-Tect'
                }
            }

            scm {
                url = 'https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API'
                connection = 'scm:git:https://github.com/Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
                developerConnection = 'scm:git:git@github.com:Arc-E-Tect/SoftwareEngineeringDoneRight-API.git'
            }
        }
    }
}

// Ship the licence inside the artifact, not only as a claim in its metadata.
tasks.named('jar') {
    from(layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
}

dependencies {
    implementation libs.dsl.updater.core

    // TestKit runs the plugin through a real Gradle build. The unit tests below it
    // cover the pure logic -- hashing, the lockfile format, manifest parsing -- but
    // none of them apply the plugin, so none of them would notice a broken DSL, a
    // task that never gets registered, or a dependency that Gradle refuses to
    // accept. Those are exactly the failures a consumer meets first.
    testImplementation gradleTestKit()
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testRuntimeOnly    libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    // No exclusions.
    //
    // The usual reason to exclude a plugin, its extension and its tasks is that
    // TestKit runs them in another process, where the coverage agent cannot see
    // them, so they report zero however well they are tested. The answer taken
    // here is to test those classes in-process as well -- ProjectBuilder for the
    // wiring, direct invocation for the task actions -- so the number means what
    // it says rather than meaning "everything except the interesting parts".
    violationRules {
        rule {
            limit {
                minimum = 0.9
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// Javadoc is part of the product, not a by-product.
//
// plugin-publish publishes a javadoc jar, so whatever is written here is what a
// consumer reads in their IDE. Warnings are errors: an undocumented public member
// fails the build rather than shipping a jar with a blank entry in it.
tasks.named('javadoc') {
    options {
        encoding = 'UTF-8'
        addBooleanOption('Xdoclint:all', true)
        addBooleanOption('Xwerror', true)
    }
}

tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

dependencyCheck {
    // Fatal findings fail the build only when the caller asks; otherwise the scan
    // reports and the build continues, so a new CVE in a transitive dependency
    // does not block an unrelated release at an arbitrary moment.
    failBuildOnCVSS = (System.getenv('FAIL_ON_FATAL') == 'true') ? 9 : 11
    nvd {
        apiKey = System.getenv('NVD_APIKEY_SEDR')
    }
    analyzers {
        // This is a JVM project. The Node analyzers only slow the scan down and
        // report on the test fixtures' package-lock.json, which ships nowhere.
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}
