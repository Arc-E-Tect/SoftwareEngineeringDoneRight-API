name: Reference API - Build
on:
  push:
    branches-ignore:
      - main
    # The reference API is built by the Publisher in this repository, so a change to
    # the Publisher can change the built contracts as much as a change to a fragment.
    paths:
      - 'reference-api/**'
      - 'api-only-publisher/src/**'
      - 'api-only-publisher/package.json'
      - 'api-only-publisher/package-lock.json'
      - '.github/workflows/reference-api-build.yml'

jobs:
  Detect-Changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub's own paths: trigger filter above is skipped entirely for a brand-new branch's
      # first push (there's no prior ref state to diff against), so this only re-checks paths -
      # against main - for that specific case. An existing branch's push already got here only
      # because the trigger's own paths filter matched, so it's trusted as-is.
      - name: Filter paths relevant to the reference API (new-branch pushes only)
        id: filter
        if: github.event.before == '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            changed:
              - 'reference-api/**'
              - 'api-only-publisher/src/**'
              - 'api-only-publisher/package.json'
              - 'api-only-publisher/package-lock.json'
              - '.github/workflows/reference-api-build.yml'

      - name: Decide whether to proceed
        id: decide
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=${{ steps.filter.outputs.changed }}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  Build:
    name: Build Reference API
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-only-publisher/package-lock.json

      - name: Install the Publisher
        run: npm ci --prefix api-only-publisher

      - name: Build and lint the reference API
        working-directory: reference-api
        run: |
          npm run apionly -- build
          npm run apionly -- lint

      - name: Verify the committed contracts are what the fragments build
        run: |
          # The tools' tests read reference-api/dist, so a fragment changed without
          # rebuilding it would leave them testing a contract nobody wrote.
          if [ -n "$(git status --porcelain -- reference-api/dist)" ]; then
            git status --short -- reference-api/dist
            git diff -- reference-api/dist
            echo "::error title=Reference API out of date::reference-api/dist is not what the fragments build. Run 'npm run apionly -- build' in reference-api and commit dist/."
            exit 1
          fi

  Workflow-Summary:
    name: Workflow Summary
    needs: [Detect-Changes, Build]
    if: always() && needs.Detect-Changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Output build completion
        run: |
          echo "Reference API build workflow completed"
          echo "::notice title=Build Complete::Reference API build workflow completed"
