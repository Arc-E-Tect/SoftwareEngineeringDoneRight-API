name: API-Only Publisher - Release

# The same shape as the Gradle plugins' release workflows, with one difference
# that is a property of the ecosystem rather than a choice: there is no separate
# Publish job, because @semantic-release/npm publishes as part of applying the
# release. A Gradle plugin needs its own Publish step after the tag; an npm
# package does not.

on:
  push:
    branches:
      - main
    paths:
      - 'api-only-publisher/**'
      - 'release/**'
      - '.github/workflows/api-only-publisher-release.yml'
  workflow_dispatch:

concurrency:
  group: api-only-publisher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Calculate-Version:
    uses: ./.github/workflows/semantic-version-calculate.yml
    with:
      fail_on_empty_version: ${{ github.ref_name == 'main' }}
      fail_on_existing_tag: ${{ github.ref_name == 'main' }}
      project_dir: api-only-publisher
      DEBUG: true
    secrets:
      sem_rel_token_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  Build:
    name: Build API-Only Publisher
    needs: Calculate-Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-only-publisher/package-lock.json

      - name: Install
        run: npm ci --prefix api-only-publisher

      - name: Test API-Only Publisher
        # `npm test` carries the coverage thresholds, so a release cannot ship
        # code the tests stopped covering.
        run: npm test --prefix api-only-publisher

      - name: Verify the scaffold still builds
        run: |
          # `init` is the one part of this tool whose value is the conventions
          # rather than the code, so a scaffold that does not build is a broken
          # release however well every unit test passes.
          node api-only-publisher/src/cli.js init "${RUNNER_TEMP}/scaffold"
          node api-only-publisher/src/cli.js build -C "${RUNNER_TEMP}/scaffold" --version 0.0.1

  Release-Package:
    name: Release API-Only Publisher
    needs: [Calculate-Version, Build]
    # next_version itself is never empty - it falls back to the current version so a build-only
    # caller always has something to compile with - so next_version_empty is what actually signals
    # "there is nothing new to release", not a string-emptiness check on next_version.
    if: ${{ needs.Calculate-Version.outputs.next_version_empty == 'false' }}
    permissions:
      contents: write
      # npm provenance: the attestation is signed with a short-lived OIDC
      # credential, so the published tarball traces to this workflow run and
      # commit. A tool whose purpose is making provenance auditable should not
      # ask to be taken on trust itself.
      id-token: write
    uses: ./.github/workflows/semantic-version-apply.yml
    with:
      project_dir: api-only-publisher
    secrets:
      sem_rel_token_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  Determine-Release-Type:
    needs: [Calculate-Version]
    if: ${{ needs.Calculate-Version.outputs.next_version_empty == 'false' }}
    uses: ./.github/workflows/determine-release-type.yml

  Workflow-Summary:
    name: Workflow Summary
    needs: [Build, Release-Package, Determine-Release-Type]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Output release completion
        run: |
          echo "API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} release workflow completed"
          echo "::notice title=Release Complete::API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} release workflow completed"
