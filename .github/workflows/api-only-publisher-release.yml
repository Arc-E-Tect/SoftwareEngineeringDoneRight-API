name: API-Only Publisher - Release

# The same shape as the Gradle plugins' release workflows: Calculate-Version,
# Build, Release-Package, then a separate Publish job. @semantic-release/npm is
# configured with npmPublish: false, so the tag and the registry upload are
# distinct steps here exactly as they are for a Gradle plugin.
#
# npm binds a trusted publisher to one repository AND one workflow filename, so
# unlike the Gradle plugins - which get a sibling *-publish-existing-version.yml -
# the re-publish path has to live in this file. A second workflow could build the
# tarball but could never authenticate.

on:
  push:
    branches:
      - main
    paths:
      - 'api-only-publisher/**'
      - 'release/**'
      - '.github/workflows/api-only-publisher-release.yml'
  workflow_dispatch:
    inputs:
      republish_version:
        description: 'Already-released version to publish to npm, e.g. 0.0.1. Use this when a release completed (tag and GitHub Release exist) but the npm upload failed - Calculate-Version would otherwise find nothing new and skip Publish. Only use it for the HIGHEST released version: npm publish claims the latest dist-tag unconditionally, and moving it back is not possible from here (an OIDC token authorises one publish, so npm dist-tag has no credential). Leave empty for a normal release run.'
        required: false
        type: string
        default: ''

concurrency:
  group: api-only-publisher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Calculate-Version:
    # A re-publish has nothing to calculate: the version is given, the tag exists.
    # Leaving this enabled would fail the run outright, since fail_on_empty_version
    # is true on main and there is by definition nothing new to release.
    if: ${{ inputs.republish_version == '' }}
    uses: ./.github/workflows/semantic-version-calculate.yml
    with:
      fail_on_empty_version: ${{ github.ref_name == 'main' }}
      fail_on_existing_tag: ${{ github.ref_name == 'main' }}
      project_dir: api-only-publisher
      DEBUG: true
    secrets:
      sem_rel_token_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  Build:
    name: Build API-Only Publisher
    needs: Calculate-Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-only-publisher/package-lock.json

      - name: Install
        run: npm ci --prefix api-only-publisher

      - name: Test API-Only Publisher
        # `npm test` carries the coverage thresholds, so a release cannot ship
        # code the tests stopped covering.
        run: npm test --prefix api-only-publisher

      - name: Verify the scaffold still builds
        run: |
          # `init` is the one part of this tool whose value is the conventions
          # rather than the code, so a scaffold that does not build is a broken
          # release however well every unit test passes. The scaffold declares
          # its own version, in its version file, as any library does.
          node api-only-publisher/src/cli.js init "${RUNNER_TEMP}/scaffold"
          node api-only-publisher/src/cli.js build -C "${RUNNER_TEMP}/scaffold"

  Release-Package:
    name: Release API-Only Publisher
    needs: [Calculate-Version, Build]
    # next_version itself is never empty - it falls back to the current version so a build-only
    # caller always has something to compile with - so next_version_empty is what actually signals
    # "there is nothing new to release", not a string-emptiness check on next_version.
    if: ${{ needs.Calculate-Version.outputs.next_version_empty == 'false' }}
    permissions:
      contents: write
    uses: ./.github/workflows/semantic-version-apply.yml
    with:
      project_dir: api-only-publisher
    secrets:
      sem_rel_token_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  Publish:
    name: Publish API-Only Publisher to npm
    # After the release, never before it. Publishing first would leave a version
    # on the registry that no tag points at, and npm does not allow a version to
    # be replaced.
    needs: [Calculate-Version, Release-Package]
    # always(), because in re-publish mode both upstream jobs are skipped and a
    # skipped dependency would otherwise skip this job too.
    if: >-
      ${{ always() && (
            inputs.republish_version != ''
            || (needs.Release-Package.result == 'success'
                && needs.Calculate-Version.outputs.next_version_empty == 'false')
          ) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted publishing: npm exchanges this job's OIDC token for short-lived
      # publish rights, so no npm credential is stored anywhere. The same token
      # signs the provenance attestation that ties the tarball to this run.
      id-token: write

    env:
      VERSION: ${{ inputs.republish_version != '' && inputs.republish_version || needs.Calculate-Version.outputs.next_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A re-publish builds the tarball from the tag it names, not from
          # whatever main has become since, so the upload matches the release.
          ref: ${{ inputs.republish_version != '' && format('api-only-publisher-v{0}', inputs.republish_version) || github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          # Deliberately no registry-url. It makes setup-node write an .npmrc
          # holding //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and set
          # NODE_AUTH_TOKEN to its own placeholder, XXXXX-XXXXX-XXXXX-XXXXX. npm
          # then sees a credential, skips the OIDC exchange entirely, and
          # authenticates the PUT with that placeholder - which the registry
          # rejects as a 404. Provenance still signs, because that talks to
          # GitHub's OIDC endpoint rather than to npm, which makes the failure
          # look like a permissions problem on an otherwise healthy run.
          # npm defaults to registry.npmjs.org regardless, so nothing is lost.

      - name: Ensure npm supports trusted publishing
        # OIDC token exchange landed in npm 11.5.1. An older npm skips it in
        # silence, so pin the precondition here instead of inheriting whatever
        # npm the Node 24 image happens to bundle.
        run: npm install --global npm@^11.5.1

      - name: Stamp the released version
        run: |
          # semantic-release commits the changelog but not package.json, so the
          # checked-out version is still the 0.0.0 seed. The tag is the source of
          # truth; this puts that version into the tarball about to be published.
          cd api-only-publisher
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          # No NPM_TOKEN: authentication is the OIDC exchange this job's
          # id-token permission enables. --provenance attaches a signed
          # attestation tying the tarball to this commit and this workflow run.
          #
          # This claims the latest dist-tag, which is why republish_version is
          # only safe for the highest released version. The OIDC token authorises
          # this one publish and is gone afterwards, so a follow-up npm dist-tag
          # would need a stored credential - the thing trusted publishing exists
          # to avoid.
          npm publish ./api-only-publisher --provenance

      - name: Summarize
        if: always()
        run: |
          {
            echo "## api-only-publisher"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Registry: https://www.npmjs.com/package/@arc-e-tect/api-only-publisher"
            echo
            echo "A newly published version can take a minute to appear through the CDN."
          } >> "$GITHUB_STEP_SUMMARY"

  Determine-Release-Type:
    needs: [Calculate-Version]
    if: ${{ needs.Calculate-Version.outputs.next_version_empty == 'false' }}
    uses: ./.github/workflows/determine-release-type.yml

  Workflow-Summary:
    name: Workflow Summary
    needs: [Build, Publish, Release-Package, Determine-Release-Type]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Output release completion
        run: |
          echo "API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} release workflow completed"
          echo "::notice title=Release Complete::API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} release workflow completed"
