name: API-Only Publisher - Build
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'api-only-publisher/**'
      - '.github/workflows/api-only-publisher-build.yml'
      - '.github/workflows/semantic-version-calculate.yml'
      - '.github/workflows/determine-release-type.yml'

jobs:
  Detect-Changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub's own paths: trigger filter above is skipped entirely for a brand-new branch's
      # first push (there's no prior ref state to diff against), so this only re-checks paths -
      # against main - for that specific case. An existing branch's push already got here only
      # because the trigger's own paths filter matched, so it's trusted as-is.
      - name: Filter paths relevant to this plugin (new-branch pushes only)
        id: filter
        if: github.event.before == '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          filters: |
            changed:
              - 'api-only-publisher/**'
              - '.github/workflows/api-only-publisher-build.yml'
              - '.github/workflows/semantic-version-calculate.yml'
              - '.github/workflows/determine-release-type.yml'

      - name: Decide whether to proceed
        id: decide
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=${{ steps.filter.outputs.changed }}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  Calculate-Version:
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.changed == 'true'
    uses: ./.github/workflows/semantic-version-calculate.yml
    with:
      fail_on_empty_version: false
      fail_on_existing_tag: false
      project_dir: api-only-publisher
      tag_format: 'api-only-publisher-v${version}'
    secrets:
      sem_rel_token_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  Determine-Release-Type:
    needs: [Detect-Changes, Calculate-Version]
    if: needs.Detect-Changes.outputs.changed == 'true'
    uses: ./.github/workflows/determine-release-type.yml

  Build:
    name: Build API-Only Publisher
    needs: [Detect-Changes, Calculate-Version]
    if: needs.Detect-Changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api-only-publisher/package-lock.json

      - name: Install
        run: npm ci --prefix api-only-publisher

      - name: Test API-Only Publisher
        # `npm test` carries the coverage thresholds, so a branch cannot merge
        # with code the tests stopped covering.
        run: npm test --prefix api-only-publisher

      - name: Verify the scaffold still builds
        run: |
          # `init` is the one part of this tool whose value is the conventions
          # rather than the code, so a scaffold that does not build is broken
          # however well every unit test passes.
          node api-only-publisher/src/cli.js init "${RUNNER_TEMP}/scaffold"
          node api-only-publisher/src/cli.js build -C "${RUNNER_TEMP}/scaffold"

  Image:
    name: Build and smoke-test the Docker image
    # Only when something the image is built from changed: it takes minutes, and
    # most branches never touch it. Built for linux/amd64 alone and never pushed;
    # the release builds both platforms.
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths the image is built from
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Against the previous push, or main for a branch's first push.
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'main' }}
          filters: |
            image:
              - 'api-only-publisher/Dockerfile'
              - 'api-only-publisher/.dockerignore'
              - 'api-only-publisher/docker/**'
              - 'api-only-publisher/package.json'
              - 'api-only-publisher/package-lock.json'
              - 'api-only-publisher/src/init-config.js'
              - 'api-only-publisher/src/toolchain.js'
              - 'api-only-publisher/src/pipeline.js'
              - '.github/workflows/api-only-publisher-build.yml'

      - name: Setup Node
        if: steps.filter.outputs.image == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pack the Publisher from source
        if: steps.filter.outputs.image == 'true'
        run: api-only-publisher/docker/build-context.sh 0.0.0-branch

      - name: Setup Buildx
        if: steps.filter.outputs.image == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        if: steps.filter.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api-only-publisher
          platforms: linux/amd64
          build-args: VERSION=0.0.0-branch
          tags: api-only-publisher:branch
          load: true
          push: false
          cache-from: type=gha,scope=api-only-publisher-image
          cache-to: type=gha,mode=max,scope=api-only-publisher-image

      - name: Smoke test
        if: steps.filter.outputs.image == 'true'
        run: api-only-publisher/docker/smoke-test.sh api-only-publisher:branch 0.0.0-branch

  Workflow-Summary:
    name: Workflow Summary
    needs: [Detect-Changes, Build, Image, Determine-Release-Type]
    if: always() && needs.Detect-Changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Output build completion
        run: |
          echo "API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} build workflow completed"
          echo "::notice title=Build Complete::API-Only Publisher ${{ needs.Determine-Release-Type.outputs.release_type }} build workflow completed"
