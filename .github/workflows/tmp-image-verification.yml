name: TEMPORARY - image verification

# TEMPORARY: reverted before merge. Runs, before the workflows exist on main where
# they could be dispatched, the dry run of the release's image jobs against the
# scratch names (V7) and the end-to-end reference pipeline (V6).

on:
  push:
    branches: [feat/api-only-publisher-docker-image]
    paths: ['.github/workflows/tmp-image-verification.yml']

permissions: {}

jobs:
  e2e:
    name: End to end
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/api-only-publisher-image-e2e.yml
    with:
      # The image dry run 9 built, smoke-tested, scanned and promoted.
      image: ghcr.io/arc-e-tect/api-only-publisher-scratch@sha256:828f708cda9ab3cca44cb9b9374c46f031127d0ddb1bc0615cf4f31951f4c332
    secrets:
      E2E_CLEANUP_TOKEN: ${{ secrets.E2E_CLEANUP_TOKEN }}
